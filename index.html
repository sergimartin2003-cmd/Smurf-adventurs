<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario y Rentabilidad</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2733; --muted:#6b7688; --line:#e6e9f0;
    --brand:#4f46e5; --brand-2:#6366f1; --brand-soft:#eef0fe;
    --ok:#128a5b; --ok-soft:#e5f6ee; --bad:#c0392b; --bad-soft:#fdecea;
    --warn:#b7791f; --warn-soft:#fdf3e2; --shadow:0 1px 3px rgba(20,30,60,.08),0 8px 24px rgba(20,30,60,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  a{color:var(--brand)}
  .wrap{max-width:1150px;margin:0 auto;padding:0 16px 60px}

  header.top{background:linear-gradient(120deg,#4f46e5,#7c3aed);color:#fff}
  .top-inner{max-width:1150px;margin:0 auto;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .logo{font-size:22px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
  .logo .dot{background:#fff;color:var(--brand);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:20px}
  .top .sub{opacity:.85;font-size:13px;margin-top:2px}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .top-actions select,.top-actions button{font:inherit}
  .cur-sel{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px}
  .cur-sel option{color:#111}

  nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  .tabs-inner{max-width:1150px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
  .tab{appearance:none;border:0;background:none;padding:14px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  .tab.active{color:var(--brand);border-color:var(--brand)}

  .btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:.15s}
  .btn:hover{border-color:#cfd4e2}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#4338ca}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .btn.light{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}
  .btn.light:hover{background:rgba(255,255,255,.28)}
  .btn.danger{color:var(--bad);border-color:#f0c8c3}
  .btn.danger:hover{background:var(--bad-soft)}

  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:20px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .kpi{padding:16px 18px}
  .kpi .label{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
  .kpi .hint{color:var(--muted);font-size:12.5px;margin-top:4px}
  .val.ok{color:var(--ok)} .val.bad{color:var(--bad)}

  .section-head{display:flex;align-items:center;gap:12px;margin:26px 0 14px;flex-wrap:wrap}
  .section-head h2{margin:0;font-size:19px}
  .section-head .spacer{flex:1}

  .panel{padding:18px}
  h3.panel-t{margin:0 0 4px;font-size:16px}
  .panel-sub{color:var(--muted);font-size:13px;margin:0 0 14px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);cursor:pointer;user-select:none}
  th.no-sort{cursor:default}
  tbody tr:hover{background:#fafbff}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .table-scroll{overflow-x:auto}

  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.mut{background:#eef1f6;color:var(--muted)}
  .num.ok{color:var(--ok);font-weight:700} .num.bad{color:var(--bad);font-weight:700}

  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input[type=text],input[type=number],input[type=date],select,textarea{
    font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  .search{max-width:280px}
  .filter{max-width:200px}

  /* Chart */
  .chart{display:flex;align-items:flex-end;gap:10px;height:200px;padding:10px 4px 0}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:26px}
  .bars{width:100%;height:170px;display:flex;align-items:flex-end;justify-content:center;gap:3px}
  .bar{width:46%;border-radius:6px 6px 0 0;min-height:2px;transition:height .3s}
  .bar.rev{background:#c7cbf7}
  .bar.prof{background:var(--brand)}
  .bar-lbl{font-size:11px;color:var(--muted);white-space:nowrap}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px}
  .legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}

  .empty{text-align:center;padding:44px 18px;color:var(--muted)}
  .empty .big{font-size:42px;margin-bottom:8px}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,20,40,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:24px 14px;overflow:auto}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(10,15,40,.35);animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
  .modal h3{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:17px}
  .modal form{padding:18px 20px}
  .frow{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:12px}
  .frow.one{grid-template-columns:1fr}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field .unit{position:relative}
  .modal .foot{display:flex;gap:8px;justify-content:flex-end;padding-top:6px;margin-top:6px;border-top:1px solid var(--line);padding:16px 20px 0}
  .hintline{font-size:12px;color:var(--muted);margin:-4px 0 10px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2733;color:#fff;padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  .mini-cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .lead{font-size:13px;color:var(--muted)}
  .strong-num{font-weight:800;font-size:20px}
  ul.clean{margin:8px 0 0;padding-left:18px} ul.clean li{margin:4px 0}
  /* Nube / sync */
  #cloudBtn.state-synced{background:rgba(120,231,170,.25);border-color:rgba(120,231,170,.6)}
  #cloudBtn.state-saving{background:rgba(255,255,255,.28)}
  #cloudBtn.state-offline{background:rgba(255,196,120,.28);border-color:rgba(255,196,120,.6)}
  .cloud-status{display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:10px;background:var(--brand-soft);font-size:13.5px;margin-bottom:14px}
  .cloud-status.ok{background:var(--ok-soft)} .cloud-status.off{background:var(--warn-soft)}
  .guide{border:1px solid var(--line);border-radius:10px;margin-top:8px}
  .guide>summary{cursor:pointer;padding:11px 13px;font-weight:600;font-size:13.5px;list-style:none}
  .guide>summary::-webkit-details-marker{display:none}
  .guide>summary::before{content:"▸ ";color:var(--brand)}
  .guide[open]>summary::before{content:"▾ "}
  .guide .gbody{padding:0 14px 14px;font-size:13px;color:#3a4457}
  .guide ol{padding-left:18px;margin:8px 0} .guide li{margin:6px 0}
  .guide code,.codebox{font-family:ui-monospace,Menlo,Consolas,monospace}
  .codebox{display:block;white-space:pre;overflow:auto;background:#1f2733;color:#e6e9f0;padding:12px;border-radius:8px;font-size:12px;margin:8px 0}
  .err{color:var(--bad);font-size:13px;margin:8px 0 0}
  .okmsg{color:var(--ok);font-size:13px;margin:8px 0 0}
  @media(max-width:620px){ .frow{grid-template-columns:1fr} .kpi .val{font-size:22px} }
</style>

<header class="top">
  <div class="top-inner">
    <div>
      <div class="logo"><span class="dot">📦</span> Inventario &amp; Rentabilidad</div>
      <div class="sub">Controla tus productos y descubre qué renta a largo plazo</div>
    </div>
    <div class="top-actions">
      <select id="curSel" class="cur-sel" title="Moneda">
        <option value="EUR">€ Euro</option>
        <option value="USD">$ Dólar</option>
        <option value="MXN">MXN Peso</option>
        <option value="GBP">£ Libra</option>
        <option value="COP">COP Peso col.</option>
        <option value="ARS">ARS Peso arg.</option>
      </select>
      <button class="btn light sm" data-action="cloud" id="cloudBtn" title="Sincronización en la nube">☁️ <span id="cloudBadge">Local</span></button>
      <button class="btn light sm" data-action="export-json" title="Guardar copia de seguridad">⬇️ Copia</button>
      <button class="btn light sm" data-action="import-json" title="Restaurar copia">⬆️ Restaurar</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" id="tabs">
    <button class="tab active" data-view="panel">📊 Panel</button>
    <button class="tab" data-view="productos">📦 Productos</button>
    <button class="tab" data-view="movimientos">🔁 Movimientos</button>
    <button class="tab" data-view="rentabilidad">💹 Rentabilidad</button>
  </div>
</nav>

<div class="wrap">
  <div id="view"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
"use strict";
/* ================== ESTADO Y ALMACENAMIENTO ================== */
const STORE_KEY = "inventario_rentabilidad_v1";
const CUR_INFO = {EUR:"€",USD:"$",MXN:"$",GBP:"£",COP:"$",ARS:"$"};
let S = { currency:"EUR", products:[], movements:[] };
let VIEW = "panel";
let sortKey = "name", sortDir = 1;
let q = "", catFilter = "", movFilter = "";

function migrateProducts(){
  // Datos antiguos con "extra" pasan a "envío a almacén"
  (S.products||[]).forEach(p=>{ if(p.shipIn==null && p.shipOut==null && p.extra!=null){ p.shipIn=num(p.extra); p.shipOut=0; delete p.extra; } });
}
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }
  catch(e){ console.warn("No se pudo cargar", e); }
  migrateProducts();
}
function saveLocal(){ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
function save(){ saveLocal(); scheduleCloudPush(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================== SINCRONIZACIÓN EN LA NUBE (Supabase) ==================
   Guarda todo tu inventario en la nube para verlo desde cualquier dispositivo.
   Es opcional: si no lo configuras, el programa funciona igual, guardando en local. */
const CLOUD_CFG_KEY = "inv_cloud_cfg";   // {url, anon}
const CLOUD_SES_KEY = "inv_cloud_ses";   // {access_token, refresh_token, user:{id,email}}
const Cloud = {
  cfg:null, ses:null, lastSync:null, state:"local", timer:null,
  init(){ try{ this.cfg=JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)||"null"); }catch(e){}
          try{ this.ses=JSON.parse(localStorage.getItem(CLOUD_SES_KEY)||"null"); }catch(e){} },
  saveCfg(url,anon){ this.cfg={url:String(url||"").trim().replace(/\/+$/,""),anon:String(anon||"").trim()};
    localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(this.cfg)); },
  clearCfg(){ this.cfg=null; localStorage.removeItem(CLOUD_CFG_KEY); this.clearSes(); },
  saveSes(s){ this.ses=s; localStorage.setItem(CLOUD_SES_KEY,JSON.stringify(s)); },
  clearSes(){ this.ses=null; localStorage.removeItem(CLOUD_SES_KEY); },
  isOn(){ return !!(this.cfg && this.cfg.url && this.cfg.anon && this.ses && this.ses.access_token); },
  headers(auth){ const h={ "apikey":this.cfg.anon, "Content-Type":"application/json" };
    if(auth && this.ses) h["Authorization"]="Bearer "+this.ses.access_token; return h; },
  async signIn(email,password){
    const r=await fetch(this.cfg.url+"/auth/v1/token?grant_type=password",
      {method:"POST",headers:this.headers(false),body:JSON.stringify({email,password})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error_description||j.msg||j.message||j.error||"No se pudo iniciar sesión");
    this.saveSes({access_token:j.access_token,refresh_token:j.refresh_token,user:{id:j.user.id,email:j.user.email}});
  },
  async signUp(email,password){
    const r=await fetch(this.cfg.url+"/auth/v1/signup",
      {method:"POST",headers:this.headers(false),body:JSON.stringify({email,password})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error_description||j.msg||j.message||j.error||"No se pudo crear la cuenta");
    if(j.access_token){ this.saveSes({access_token:j.access_token,refresh_token:j.refresh_token,user:{id:j.user.id,email:j.user.email}}); return true; }
    return false; // requiere confirmar email
  },
  async refresh(){
    if(!this.ses||!this.ses.refresh_token) throw new Error("sin sesión");
    const r=await fetch(this.cfg.url+"/auth/v1/token?grant_type=refresh_token",
      {method:"POST",headers:this.headers(false),body:JSON.stringify({refresh_token:this.ses.refresh_token})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ this.clearSes(); throw new Error("La sesión ha caducado, vuelve a entrar"); }
    this.saveSes({access_token:j.access_token,refresh_token:j.refresh_token,user:{id:j.user.id,email:j.user.email}});
  },
  async _fetch(path,opts,retry){
    let r=await fetch(this.cfg.url+path,opts);
    if(r.status===401 && !retry){ await this.refresh(); opts.headers=Object.assign(opts.headers,{Authorization:"Bearer "+this.ses.access_token}); return this._fetch(path,opts,true); }
    return r;
  },
  async pull(){
    const r=await this._fetch("/rest/v1/inventory_state?select=data,updated_at",{headers:this.headers(true)});
    if(!r.ok) throw new Error("No se pudo leer de la nube ("+r.status+")");
    const rows=await r.json(); return rows[0]||null;
  },
  async push(data){
    const body=[{ user_id:this.ses.user.id, data, updated_at:new Date().toISOString() }];
    const r=await this._fetch("/rest/v1/inventory_state?on_conflict=user_id",
      {method:"POST",headers:Object.assign(this.headers(true),{Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});
    if(!r.ok){ const t=await r.text().catch(()=>""); throw new Error("No se pudo guardar en la nube ("+r.status+") "+t); }
  }
};

function setCloudState(st){ Cloud.state=st; updateCloudBadge(); }
function updateCloudBadge(){
  const btn=document.getElementById("cloudBtn"), badge=document.getElementById("cloudBadge");
  if(!btn||!badge) return;
  btn.classList.remove("state-synced","state-saving","state-offline");
  const map={local:["Local",""],saving:["Guardando…","state-saving"],synced:["Sincronizado ✓","state-synced"],offline:["Sin conexión","state-offline"]};
  const [txt,cls]=map[Cloud.state]||map.local; badge.textContent=txt; if(cls) btn.classList.add(cls);
}
function scheduleCloudPush(){
  if(!Cloud.isOn()) return;
  setCloudState("saving"); clearTimeout(Cloud.timer);
  Cloud.timer=setTimeout(cloudPush, 700);
}
async function cloudPush(){
  if(!Cloud.isOn()) return;
  try{ await Cloud.push({currency:S.currency,products:S.products,movements:S.movements});
    Cloud.lastSync=new Date(); setCloudState("synced"); }
  catch(e){ console.warn(e); setCloudState("offline"); }
}
async function cloudInitialSync(){
  // Al entrar: si la nube tiene datos, se cargan; si está vacía, se sube lo local (primera vez)
  try{
    const row=await Cloud.pull();
    if(row && row.data && ((row.data.products&&row.data.products.length)||(row.data.movements&&row.data.movements.length))){
      S=Object.assign({currency:"EUR",products:[],movements:[]},row.data); migrateProducts(); saveLocal();
      const cs=document.getElementById("curSel"); if(cs) cs.value=S.currency;
      render();
    } else {
      await Cloud.push({currency:S.currency,products:S.products,movements:S.movements});
    }
    Cloud.lastSync=new Date(); setCloudState("synced");
  }catch(e){ console.warn(e); setCloudState("offline"); }
}
async function cloudPullNow(){
  if(!Cloud.isOn()) return;
  setCloudState("saving");
  try{
    const row=await Cloud.pull();
    if(row && row.data){ S=Object.assign({currency:"EUR",products:[],movements:[]},row.data); migrateProducts(); saveLocal();
      const cs=document.getElementById("curSel"); if(cs) cs.value=S.currency; render(); }
    Cloud.lastSync=new Date(); setCloudState("synced"); toast("Datos actualizados desde la nube");
  }catch(e){ console.warn(e); setCloudState("offline"); toast("No se pudo sincronizar (sin conexión)"); }
  openCloudModal();
}

const SETUP_SQL = `create table if not exists inventory_state (
  user_id uuid primary key references auth.users on delete cascade,
  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);
alter table inventory_state enable row level security;
create policy "propio_leer"      on inventory_state for select using (auth.uid() = user_id);
create policy "propio_insertar"  on inventory_state for insert with check (auth.uid() = user_id);
create policy "propio_actualizar" on inventory_state for update using (auth.uid() = user_id) with check (auth.uid() = user_id);`;

function cloudGuideHTML(){
  return `<details class="guide"><summary>¿Cómo consigo esto? Guía rápida (una sola vez, ~10 min)</summary>
    <div class="gbody">
      <ol>
        <li>Entra en <b>supabase.com</b>, crea una cuenta gratis y pulsa <b>New project</b>. Ponle un nombre y una contraseña de base de datos (guárdala). Espera 1-2 min a que se cree.</li>
        <li>En el menú izquierdo abre <b>SQL Editor</b>, pega este código y pulsa <b>Run</b> (crea la tabla donde se guardan tus datos):
          <textarea id="sqlBox" readonly class="codebox" style="width:100%;height:120px;border:0">${esc(SETUP_SQL)}</textarea>
          <button type="button" class="btn sm" data-cloud="copy-sql">📋 Copiar código</button>
        </li>
        <li>Ve a <b>Project Settings → API</b> y copia dos datos:
          <ul class="clean"><li><b>Project URL</b> → va en «URL del proyecto».</li>
          <li><b>anon public</b> (Project API keys) → va en «Clave anónima».</li></ul>
        </li>
        <li>Recomendado: en <b>Authentication → Sign In / Providers → Email</b>, desactiva <b>Confirm email</b> para poder entrar sin confirmar el correo.</li>
        <li>Pega los dos datos aquí abajo, guarda, y crea tu cuenta con email y contraseña. A partir de ahí, todo se sincroniza solo.</li>
      </ol>
    </div></details>`;
}

function openCloudModal(){
  let body, foot;
  if(!Cloud.cfg || !Cloud.cfg.url || !Cloud.cfg.anon){
    // Paso 1: conectar el proyecto
    body = `<p class="panel-sub" style="margin-top:0">Sincroniza tu inventario para verlo y editarlo desde el móvil, el ordenador y donde quieras. Usa <b>Supabase</b> (gratis). Configúralo una vez:</p>
      ${cloudGuideHTML()}
      <div class="frow one" style="margin-top:14px"><div class="field"><label>URL del proyecto</label>
        <input type="text" id="cfgUrl" placeholder="https://xxxxxxxx.supabase.co"></div></div>
      <div class="frow one"><div class="field"><label>Clave anónima (anon public)</label>
        <input type="text" id="cfgAnon" placeholder="eyJhbGciOi..."></div></div>
      <div id="cloudMsg"></div>`;
    foot = `<button type="button" class="btn ghost" data-action="close-modal">Cerrar</button>
      <button type="button" class="btn primary" data-cloud="save-cfg">Guardar conexión</button>`;
  } else if(!Cloud.isOn()){
    // Paso 2: iniciar sesión / crear cuenta
    body = `<div class="cloud-status">🔌 Proyecto conectado: <b>${esc(Cloud.cfg.url.replace(/^https?:\/\//,""))}</b></div>
      <p class="panel-sub" style="margin-top:0">Entra con tu email y contraseña. Si es la primera vez, pulsa «Crear cuenta».</p>
      <div class="frow one"><div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="tucorreo@ejemplo.com"></div></div>
      <div class="frow one"><div class="field"><label>Contraseña</label><input type="password" id="authPass" placeholder="mínimo 6 caracteres"></div></div>
      <div id="cloudMsg"></div>
      <p class="hintline" style="margin-top:10px"><a href="#" data-cloud="change-project">Cambiar de proyecto</a></p>`;
    foot = `<button type="button" class="btn ghost" data-action="close-modal">Cerrar</button>

function cloudMsg(html,cls){ const el=document.getElementById("cloudMsg"); if(el) el.innerHTML=`<p class="${cls||'err'}">${html}</p>`; }

async function handleCloudAction(act){
  if(act==="copy-sql"){ const t=document.getElementById("sqlBox"); if(t){ t.select(); try{document.execCommand("copy");}catch(e){} toast("Código copiado"); } return; }
  if(act==="change-project"){ if(confirm("¿Cambiar de proyecto? Se cerrará la sesión actual.")){ Cloud.clearCfg(); setCloudState("local"); openCloudModal(); } return; }
  if(act==="save-cfg"){
    const url=document.getElementById("cfgUrl").value.trim(), anon=document.getElementById("cfgAnon").value.trim();
    if(!/^https?:\/\/.+/.test(url)){ cloudMsg("La URL del proyecto no parece válida (debe empezar por https://)."); return; }
    if(anon.length<20){ cloudMsg("La clave anónima parece incompleta."); return; }
    Cloud.saveCfg(url,anon); openCloudModal(); return;
  }
  if(act==="signin"||act==="signup"){
    const email=document.getElementById("authEmail").value.trim(), pass=document.getElementById("authPass").value;
    if(!email||!pass){ cloudMsg("Escribe tu email y contraseña."); return; }
    cloudMsg("Conectando…","okmsg");
    try{
      if(act==="signup"){ const ok=await Cloud.signUp(email,pass);
        if(!ok){ cloudMsg("Cuenta creada. Revisa tu correo y confirma el email, o desactiva «Confirm email» en Supabase; luego pulsa «Entrar».","okmsg"); return; } }
      else { await Cloud.signIn(email,pass); }
      await cloudInitialSync(); openCloudModal(); toast("Conectado a la nube");
    }catch(e){ cloudMsg(esc(e.message||"No se pudo conectar")); setCloudState("local"); }
    return;
  }
  if(act==="sync-now"){ await cloudPullNow(); return; }
  if(act==="signout"){ if(confirm("¿Cerrar sesión en este dispositivo? Tus datos siguen guardados en la nube y en local.")){ Cloud.clearSes(); setCloudState("local"); openCloudModal(); } return; }
}

/* ================== UTILIDADES ================== */
function num(v){ if(typeof v==="number") return v; if(v==null||v==="") return 0;
  return parseFloat(String(v).replace(/\s/g,"").replace(",",".")) || 0; }
function money(v){ try{ return new Intl.NumberFormat("es-ES",{style:"currency",currency:S.currency}).format(v||0); }
  catch(e){ return (v||0).toFixed(2)+" "+(CUR_INFO[S.currency]||""); } }
function pct(v){ if(!isFinite(v)) v=0; return (v*100).toFixed(1).replace(".",",")+" %"; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function monthKey(iso){ return (iso||"").slice(0,7); }
function monthLabel(k){ const [y,m]=k.split("-"); const n=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"]; return n[+m-1]+" "+y.slice(2); }

/* ================== CÁLCULOS DE RENTABILIDAD ================== */
function effCost(p){ return num(p.cost)+num(p.shipIn)+num(p.shipOut)+num(p.extra); } // coste real = producto + envío a almacén + envío final (extra = compatibilidad datos antiguos)
function unitMargin(p){ return num(p.price)-effCost(p); }          // margen por unidad
function unitMarginPct(p){ return num(p.price)>0 ? unitMargin(p)/num(p.price) : 0; }

function productStats(p){
  const sales = S.movements.filter(m=>m.productId===p.id && m.type==="venta");
  const buys  = S.movements.filter(m=>m.productId===p.id && m.type==="compra");
  const unitsSold = sales.reduce((s,m)=>s+num(m.qty),0);
  const revenue   = sales.reduce((s,m)=>s+num(m.qty)*num(m.unitValue),0);
  const cogs      = sales.reduce((s,m)=>s+num(m.qty)*num(m.costBasis!=null?m.costBasis:effCost(p)),0);
  const profit    = revenue-cogs;
  const spent     = buys.reduce((s,m)=>s+num(m.qty)*num(m.unitValue),0);
  const marginPct = revenue>0 ? profit/revenue : unitMarginPct(p);
  const stockValue= num(p.stock)*effCost(p);
  return {unitsSold, revenue, cogs, profit, spent, marginPct, stockValue, hasSales:sales.length>0};
}

function globalStats(){
  let revenue=0, profit=0, stockValue=0, potential=0, unitsSold=0, invested=0;
  S.products.forEach(p=>{ const st=productStats(p);
    revenue+=st.revenue; profit+=st.profit; unitsSold+=st.unitsSold;
    stockValue+=st.stockValue; potential+=num(p.stock)*num(p.price);
  });
  S.movements.forEach(m=>{ if(m.type==="compra") invested+=num(m.qty)*num(m.unitValue); });
  const marginPct = revenue>0 ? profit/revenue : 0;
  return {revenue, profit, stockValue, potential, unitsSold, invested, marginPct};
}

function monthlySeries(months=6){
  const map={};
  S.movements.forEach(m=>{
    const k=monthKey(m.date); if(!k) return;
    map[k]=map[k]||{rev:0,prof:0,spend:0};
    if(m.type==="venta"){ const rev=num(m.qty)*num(m.unitValue); const cost=num(m.qty)*num(m.costBasis||0);
      map[k].rev+=rev; map[k].prof+=rev-cost; }
    if(m.type==="compra"){ map[k].spend+=num(m.qty)*num(m.unitValue); }
  });
  // últimos N meses hasta hoy
  const out=[]; const d=new Date();
  for(let i=months-1;i>=0;i--){ const dt=new Date(d.getFullYear(),d.getMonth()-i,1);
    const k=dt.toISOString().slice(0,7); out.push(Object.assign({key:k},map[k]||{rev:0,prof:0,spend:0})); }
  return out;
}

function kpi(label,val,cls,hint){ return `<div class="card kpi"><div class="label">${label}</div>
  <div class="val ${cls||""}">${val}</div><div class="hint">${hint||""}</div></div>`; }

function buildAlerts(){
  const out=[];
  S.products.forEach(p=>{
    if(unitMargin(p)<0) out.push(`🔴 <b>${esc(p.name)}</b>: lo vendes por debajo del coste (pierdes ${money(-unitMargin(p))} por unidad).`);
    const min = num(p.minStock);
    if(min>0 && num(p.stock)<=min) out.push(`🟠 <b>${esc(p.name)}</b>: stock bajo (${num(p.stock)} uds, mínimo ${min}).`);
    else if(num(p.stock)===0 && S.products.length) out.push(`⚪ <b>${esc(p.name)}</b>: sin stock.`);
  });
  return out.slice(0,12);
}

function topProductsCard(){
  const rows = S.products.map(p=>({p,st:productStats(p)}))
    .sort((a,b)=>b.st.profit-a.st.profit);
  if(!rows.length) return `<div class="card panel"><p class="lead">Aún no has añadido productos.</p></div>`;
  const top = rows.slice(0,5);
  return `<div class="card table-scroll"><table>
    <thead><tr><th>Producto</th><th class="num">Vendidas</th><th class="num">Ingresos</th><th class="num">Beneficio</th><th class="num">Margen</th><th>Estado</th></tr></thead>

      <td class="num">${pct(st.marginPct)}</td>
      <td>${stateBadge(p,st)}</td></tr>`).join("")}</tbody></table></div>`;
}

function stateBadge(p,st){
  if(unitMargin(p)<0) return `<span class="pill bad">Vende con pérdida</span>`;
  if(!st.hasSales) return `<span class="pill mut">Sin ventas aún</span>`;
  if(st.profit>0) return `<span class="pill ok">Rentable</span>`;
  return `<span class="pill warn">Ajustado</span>`;
}

function renderProductos(){
  const cats = [...new Set(S.products.map(p=>p.category).filter(Boolean))].sort();
  let list = S.products.slice();
  if(q) list = list.filter(p=>(p.name+" "+(p.category||"")+" "+(p.sku||"")).toLowerCase().includes(q.toLowerCase()));
  if(catFilter) list = list.filter(p=>p.category===catFilter);
  list.sort((a,b)=>{
    const sa=productStats(a), sb=productStats(b);
    const val=k=>({name:a=>a.name.toLowerCase(), cost:a=>effCost(a), price:a=>num(a.price),
      margin:a=>unitMargin(a), stock:a=>num(a.stock)}[k]);
    let A,B;
    if(sortKey==="sold"){A=sa.unitsSold;B=sb.unitsSold;}
    else if(sortKey==="profit"){A=sa.profit;B=sb.profit;}
    else{ const f=val(sortKey); A=f(a); B=f(b); }
    if(A<B) return -1*sortDir; if(A>B) return 1*sortDir; return 0;
  });

  viewEl.innerHTML = `
    <div class="section-head"><h2>Productos</h2><div class="spacer"></div>
      <button class="btn sm" data-action="export-csv">📄 Exportar a Excel (CSV)</button>

        ${cats.map(c=>`<option value="${esc(c)}" ${c===catFilter?"selected":""}>${esc(c)}</option>`).join("")}</select>
    </div>
    ${list.length? `<div class="card table-scroll"><table>
      <thead><tr>
        <th data-sort="name">Producto ${arrow("name")}</th>
        <th>Categoría</th>
        <th class="num" data-sort="cost">Coste ${arrow("cost")}</th>
        <th class="num" data-sort="price">Precio ${arrow("price")}</th>
        <th class="num" data-sort="margin">Margen ud. ${arrow("margin")}</th>
        <th class="num" data-sort="stock">Stock ${arrow("stock")}</th>
        <th class="num" data-sort="sold">Vendidas ${arrow("sold")}</th>

  if(sb){ sb.oninput=e=>{ q=e.target.value; const pos=e.target.selectionStart; renderProductos();

  const cf=document.getElementById("catFilter"); if(cf) cf.onchange=e=>{ catFilter=e.target.value; renderProductos(); };

/* ---------- RENTABILIDAD ---------- */
function renderRentabilidad(){
  const g=globalStats();

  const sinVentas=rows.filter(r=>!r.st.hasSales && unitMargin(r.p)>=0);

  viewEl.innerHTML = `

function section(title, rows, sub, danger){
  return `<div class="section-head"><h2>${title}</h2></div>
    <div class="card panel"><p class="panel-sub" style="margin-top:-4px">${sub}</p>
    ${rows.length? `<div class="table-scroll"><table>
      <thead><tr><th>Producto</th><th class="num">Coste real</th><th class="num">Precio</th><th class="num">Margen ud.</th><th class="num">Vendidas</th><th class="num">Beneficio</th><th>Estado</th></tr></thead>
      <tbody>${rows.map(({p,st})=>`<tr>
        <td><b>${esc(p.name)}</b></td>
        <td class="num">${money(effCost(p))}</td>
        <td class="num">${money(num(p.price))}</td>
        <td class="num ${unitMargin(p)<0?'bad':'ok'}">${money(unitMargin(p))}</td>
        <td class="num">${st.unitsSold}</td>
        <td class="num ${st.profit>=0?'ok':'bad'}">${money(st.profit)}</td>
        <td>${stateBadge(p,st)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="lead">Ninguno por ahora.</p>`}</div>`;
}

/* ================== MODALES / FORMULARIOS ================== */
const modalBg=document.getElementById("modalBg"), modalEl=document.getElementById("modal");
let onSubmit=null;
function openModal(title, bodyHTML, submitCb, submitLabel){
  modalEl.innerHTML = `<h3>${title}</h3><form id="mForm">${bodyHTML}
    <div class="foot"><button type="button" class="btn ghost" data-action="close-modal">Cancelar</button>
    <button type="submit" class="btn primary">${submitLabel||"Guardar"}</button></div></form>`;
  onSubmit=submitCb; modalBg.classList.add("show");
  const first=modalEl.querySelector("input,select,textarea"); if(first) setTimeout(()=>first.focus(),40);
  document.getElementById("mForm").onsubmit=e=>{ e.preventDefault();
    const data={}; new FormData(e.target).forEach((v,k)=>data[k]=v); onSubmit(data); };
}
function closeModal(){ modalBg.classList.remove("show"); onSubmit=null; }
function field(label,name,type,val,attrs){ return `<div class="field"><label>${label}</label>
  <input type="${type}" name="${name}" value="${val==null?"":esc(val)}" ${attrs||""}></div>`; }

function productForm(p){
  p=p||{};
  return openModal(p.id?"Editar producto":"Nuevo producto", `
    <div class="frow one"><div class="field"><label>Nombre del producto *</label>
      <input type="text" name="name" value="${esc(p.name||"")}" required placeholder="Ej. Camiseta azul talla M"></div></div>
    <div class="frow">
      <div class="field"><label>Categoría</label><input type="text" name="category" value="${esc(p.category||"")}" placeholder="Ej. Ropa"></div>
      <div class="field"><label>Código / SKU</label><input type="text" name="sku" value="${esc(p.sku||"")}" placeholder="Opcional"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Coste del producto (por unidad) *</label><input type="text" name="cost" value="${p.cost!=null?p.cost:""}" required inputmode="decimal" placeholder="0,00"></div>
      <div class="field"><label>Envío a almacén (por unidad)</label><input type="text" name="shipIn" value="${p.shipIn!=null?p.shipIn:""}" inputmode="decimal" placeholder="0,00"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Envío final / al cliente (por unidad)</label><input type="text" name="shipOut" value="${p.shipOut!=null?p.shipOut:""}" inputmode="decimal" placeholder="0,00"></div>
      <div class="field"><label>Precio de venta (por unidad) *</label><input type="text" name="price" value="${p.price!=null?p.price:""}" required inputmode="decimal" placeholder="0,00"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Stock actual</label><input type="text" name="stock" value="${p.stock!=null?p.stock:""}" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label>Aviso de stock mínimo</label><input type="text" name="minStock" value="${p.minStock!=null?p.minStock:""}" inputmode="numeric" placeholder="Ej. 5"></div>
    </div>
    <div class="frow one"><div class="field"><label>Notas</label><input type="text" name="notes" value="${esc(p.notes||"")}" placeholder="Opcional"></div></div>
    <p class="hintline">El <b>coste real por unidad</b> = coste del producto + envío a almacén + envío final. El <b>beneficio por unidad</b> = precio de venta − coste real. Puedes usar coma o punto para los decimales.</p>
  `, data=>{
    if(!data.name.trim()){ toast("Pon un nombre al producto"); return; }
    if(p.id){ const idx=S.products.findIndex(x=>x.id===p.id);
      S.products[idx]=Object.assign(S.products[idx],{
        name:data.name.trim(), category:data.category.trim(), sku:data.sku.trim(),
        cost:num(data.cost), shipIn:num(data.shipIn), shipOut:num(data.shipOut), extra:0, price:num(data.price),
        stock:num(data.stock), minStock:num(data.minStock), notes:data.notes.trim() });
      toast("Producto actualizado");
    } else {
      S.products.push({ id:uid(), name:data.name.trim(), category:data.category.trim(), sku:data.sku.trim(),
        cost:num(data.cost), shipIn:num(data.shipIn), shipOut:num(data.shipOut), price:num(data.price),
        stock:num(data.stock), minStock:num(data.minStock), notes:data.notes.trim(), createdAt:todayISO() });
      toast("Producto añadido");
    }
    save(); closeModal(); render();
  }, p.id?"Guardar cambios":"Añadir producto");
}

function movementForm(type, productId){
  if(!S.products.length){ toast("Primero añade un producto"); return; }
  const preP = S.products.find(p=>p.id===productId);
  const defVal = type==="venta" ? (preP?num(preP.price):"") : type==="compra" ? (preP?num(preP.cost):"") : "";
  const opts = S.products.map(p=>`<option value="${p.id}" ${p.id===productId?"selected":""}>${esc(p.name)} (stock ${num(p.stock)})</option>`).join("");
  const titles={venta:"Registrar venta",compra:"Registrar reposición / compra",ajuste:"Ajuste de stock"};
  openModal(titles[type]||"Movimiento", `
    <input type="hidden" name="type" value="${type}">
    <div class="frow one"><div class="field"><label>Producto</label><select name="productId" required>${opts}</select></div></div>
    <div class="frow">
      <div class="field"><label>Cantidad *</label><input type="text" name="qty" required inputmode="numeric" placeholder="Ej. 1"></div>
      ${type==="ajuste"?`<div class="field"><label>&nbsp;</label><div class="hintline">Usa cantidad positiva para sumar stock o negativa (ej. -3) para restar.</div></div>`
        :`<div class="field"><label>${type==="venta"?"Precio de venta por unidad *":"Coste por unidad *"}</label><input type="text" name="unitValue" value="${defVal}" required inputmode="decimal" placeholder="0,00"></div>`}
    </div>
    <div class="frow">
      <div class="field"><label>Fecha</label><input type="date" name="date" value="${todayISO()}"></div>
      <div class="field"><label>Nota</label><input type="text" name="note" placeholder="Opcional"></div>
    </div>
    ${type==="venta"?`<p class="hintline">El beneficio se calcula con el coste real del producto en este momento. Puedes cambiar el precio si hiciste una oferta.</p>`:""}
  `, data=>{
    const p=S.products.find(x=>x.id===data.productId); if(!p){ toast("Selecciona un producto"); return; }
    let qty=num(data.qty);
    if(type!=="ajuste" && qty<=0){ toast("La cantidad debe ser mayor que 0"); return; }
    if(type==="ajuste" && qty===0){ toast("Indica una cantidad distinta de 0"); return; }
    const mov={ id:uid(), ts:Date.now(), productId:p.id, type, qty, date:data.date||todayISO(), note:(data.note||"").trim() };
    if(type==="venta"){ mov.unitValue=num(data.unitValue); mov.costBasis=effCost(p); p.stock=num(p.stock)-qty; }
    else if(type==="compra"){ mov.unitValue=num(data.unitValue); p.stock=num(p.stock)+qty; }
    else { mov.unitValue=0; p.stock=num(p.stock)+qty; }
    S.movements.push(mov); save(); closeModal(); render();
    toast(type==="venta"?"Venta registrada":type==="compra"?"Reposición registrada":"Stock ajustado");
  }, "Registrar");
}

/* ================== ACCIONES ================== */
function delProduct(id){ const p=S.products.find(x=>x.id===id); if(!p) return;
  const n=S.movements.filter(m=>m.productId===id).length;
  if(!confirm(`¿Borrar "${p.name}"?`+(n?` Se borrarán también sus ${n} movimientos.`:"")+"\nEsta acción no se puede deshacer.")) return;
  S.products=S.products.filter(x=>x.id!==id); S.movements=S.movements.filter(m=>m.productId!==id);
  save(); render(); toast("Producto borrado");
}
function delMovement(id){ const m=S.movements.find(x=>x.id===id); if(!m) return;
  if(!confirm("¿Eliminar este movimiento? Se revertirá su efecto en el stock.")) return;
  const p=S.products.find(x=>x.id===m.productId);
  if(p){ if(m.type==="venta") p.stock=num(p.stock)+num(m.qty);
    else p.stock=num(p.stock)-num(m.qty); }
  S.movements=S.movements.filter(x=>x.id!==id); save(); render(); toast("Movimiento eliminado");
}

/* ================== COPIAS DE SEGURIDAD ================== */
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  downloadBlob(blob, `inventario-copia-${todayISO()}.json`); toast("Copia de seguridad descargada");
}
function exportCSV(){
  if(!S.products.length){ toast("No hay productos"); return; }
  const head=["Producto","Categoria","SKU","Coste producto","Envio almacen","Envio final","Coste real","Precio","Margen ud","Margen %","Stock","Vendidas","Ingresos","Beneficio"];
  const lines=[head.join(";")];
  S.products.forEach(p=>{ const st=productStats(p);
    lines.push([p.name,p.category||"",p.sku||"",num(p.cost),num(p.shipIn),num(p.shipOut),effCost(p),num(p.price),
      unitMargin(p),(unitMarginPct(p)*100).toFixed(1),num(p.stock),st.unitsSold,st.revenue.toFixed(2),st.profit.toFixed(2)]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")); });
  downloadBlob(new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"}), `inventario-${todayISO()}.csv`);
  toast("CSV exportado (ábrelo con Excel)");
}
function downloadBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
const fileInput=document.getElementById("fileInput");
function importJSON(){ fileInput.click(); }
fileInput.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
    if(!data.products) throw 0;
    if(!confirm("Esto reemplazará tus datos actuales por los de la copia. ¿Continuar?")) return;
    S=Object.assign({currency:"EUR",products:[],movements:[]},data); save();
    document.getElementById("curSel").value=S.currency; render(); toast("Copia restaurada");
  }catch(err){ toast("El archivo no es una copia válida"); } };
  r.readAsText(f); fileInput.value=""; };

/* ================== DATOS DE EJEMPLO ================== */

  const p1={id:uid(),name:"Vela aromática lavanda",category:"Hogar",sku:"VL-01",cost:3.5,shipIn:0.4,shipOut:0.2,price:12,stock:18,minStock:5,notes:"",createdAt:todayISO()};
  const p2={id:uid(),name:"Taza cerámica",category:"Hogar",sku:"TZ-02",cost:2.2,shipIn:0.3,shipOut:0.1,price:9.9,stock:4,minStock:6,notes:"",createdAt:todayISO()};
  const p3={id:uid(),name:"Pulsera artesanal",category:"Bisutería",sku:"PB-03",cost:1.1,shipIn:0.1,shipOut:0.1,price:6.5,stock:30,minStock:8,notes:"",createdAt:todayISO()};
  const p4={id:uid(),name:"Jabón natural (pack)",category:"Cosmética",sku:"JB-04",cost:5,shipIn:0.5,shipOut:0.3,price:5.5,stock:12,minStock:4,notes:"margen muy justo",createdAt:todayISO()};
  S.products=[p1,p2,p3,p4]; S.movements=[];
  const mk=(prod,type,qty,val,daysAgo,cb)=>{ const d=new Date(); d.setDate(d.getDate()-daysAgo);
    return {id:uid(),ts:Date.now()+Math.random(),productId:prod.id,type,qty,unitValue:val,costBasis:cb,date:d.toISOString().slice(0,10),note:""}; };
  S.movements.push(mk(p1,"venta",6,12,80,4.1), mk(p1,"venta",5,12,50,4.1), mk(p1,"venta",7,11,15,4.1));
  S.movements.push(mk(p2,"venta",8,9.9,70,2.6), mk(p2,"venta",6,9.9,20,2.6));
  S.movements.push(mk(p3,"venta",12,6.5,60,1.3), mk(p3,"venta",10,6.5,25,1.3), mk(p3,"venta",8,6,5,1.3));
  S.movements.push(mk(p4,"venta",5,5.5,45,5.8), mk(p4,"venta",4,5.5,10,5.8));
  save(); render(); toast("Datos de ejemplo cargados");
}

/* ================== EVENTOS ================== */
document.getElementById("tabs").addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(!t) return; VIEW=t.dataset.view; render(); });
document.getElementById("curSel").addEventListener("change",e=>{ S.currency=e.target.value; save(); render(); });

viewEl.addEventListener("click",e=>{ const th=e.target.closest("th[data-sort]");
  if(th){ const k=th.dataset.sort; if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;} renderProductos(); } });

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id;
  const map={
    "add-product":()=>productForm(),
    "edit-product":()=>productForm(S.products.find(p=>p.id===id)),
    "del-product":()=>delProduct(id),
    "sell":()=>movementForm("venta",id),
    "restock":()=>movementForm("compra",id),
    "new-movement":()=>movementForm("venta"),
    "del-movement":()=>delMovement(id),
    "close-modal":()=>closeModal(),
    "export-json":()=>exportJSON(),
    "import-json":()=>importJSON(),
    "export-csv":()=>exportCSV(),
    "load-demo":()=>loadDemo(),
    "cloud":()=>openCloudModal(),
  };
  if(map[a]){ e.preventDefault(); map[a](); }
});
document.addEventListener("click",e=>{ const el=e.target.closest("[data-cloud]"); if(!el) return;
  e.preventDefault(); handleCloudAction(el.dataset.cloud); });
modalBg.addEventListener("click",e=>{ if(e.target===modalBg) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ================== TOAST ================== */
let toastT; const toastEl=document.getElementById("toast");
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"),2200); }

/* ================== INICIO ================== */
load();
Cloud.init();
document.getElementById("curSel").value=S.currency;
render();
updateCloudBadge();
if(Cloud.isOn()){ setCloudState("saving"); cloudInitialSync(); }
</script>
